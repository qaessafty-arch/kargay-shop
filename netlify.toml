[build]
  command = "npm ci"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**", "views/**", "src/**", "scripts/legacy/**"]
  # Native and large packages stay in node_modules instead of being bundled.
  external_node_modules = ["sharp", "pg", "@electric-sql/pglite", "@netlify/blobs"]

[functions."server"]
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
